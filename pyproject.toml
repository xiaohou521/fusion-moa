[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion-runtime"
version = "0.1.0"
description = "Model- and harness-independent coding model fusion runtime"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.9"]

[project.scripts]
fusion-runtime = "fusion_runtime.cli:main"
fusion-runtime-gate = "fusion_runtime.evaluation:main"

[project.entry-points."fusion_runtime.providers"]
# Third-party packages may register provider factories here.

[project.entry-points."fusion_runtime.policies"]
# Third-party packages may register policy factories here.

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
