version: fusion/v1

providers:
  local:
    type: openai-compatible
    base_url: http://127.0.0.1:8000/v1
    api_key_env: LOCAL_MODEL_KEY

models:
  executor:
    provider: local
    model: my-coding-model
    context_window: 131072
    max_output: 8192
    modalities: [text]
    capabilities: [coding, reasoning]
    tool_calling: true
    reasoning: true
    generation:
      thinking:
        modes: [provider-default]
      final_answer_reserve: false
    max_concurrency: 2

  critic:
    provider: local
    model: my-critic-model
    context_window: 65536
    max_output: 2048
    modalities: [text]
    capabilities: [code-review]
    reasoning: true
    max_concurrency: 1

pools:
  coding:
    main: executor
    experts:
      critic: critic

policy:
  type: main-critic
  max_expert_calls: 1
  options:
    expert_max_tokens: 2048
    max_advice_chars: 12000

completion:
  require_public_output: true
  require_tool_or_text: true
  max_recovery_attempts: 1
  recovery_max_tokens: 2048

serve:
  model_name: fusion-coding
  pool: coding
  protocols: [openai-chat, openai-responses, anthropic-messages]
